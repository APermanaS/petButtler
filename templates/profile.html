<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Profil Saya - Pet Butler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .text-orange { color: #ff914d; }
        .btn-pet { background-color: #ff914d; color: white; font-weight: bold; }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow border-0" style="border-radius: 20px;">
            <div class="card-body p-4">
                <h3 class="fw-bold text-orange mb-4 text-center">👤 Profil Pengguna</h3>
                
                {% if message %}
                <div class="alert alert-success small">{{ message }}</div>
                {% endif %}

                <form action="/profile" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold small">Nama Lengkap</label>
                        <input type="text" name="name" class="form-control" value="{{ profile.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold small">Nomor Telepon (WhatsApp)</label>
                        <input type="text" name="phone" class="form-control" value="{{ profile.phone }}" placeholder="0812..." required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold small">Alamat Utama</label>
                        <textarea name="address" class="form-control" rows="3" required>{{ profile.address }}</textarea>
                    </div>
                    <button type="submit" class="btn btn-pet w-100 py-2">Simpan Perubahan</button>
                </form>
                
                <div class="text-center mt-3">
                    <a href="/dashboard" class="text-muted small text-decoration-none">← Kembali ke Dashboard</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
