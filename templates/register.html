<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Pet Butler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .btn-pet { background-color: #ff914d; color: white; border-radius: 10px; }
        .btn-pet:hover { background-color: #e6732f; color: white; }
        .card-auth { border-radius: 15px; border: none; }
        .text-orange { color: #ff914d; }
    </style>
</head>
<body>

<div class="container vh-100 d-flex align-items-center justify-content-center">
    <div class="card card-auth shadow-lg" style="width: 100%; max-width: 450px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <h2 class="fw-bold text-orange">🐾 Daftar Pet Butler</h2>
                <p class="text-muted">Bergabunglah untuk layanan terbaik</p>
            </div>

            {% if message %}
            <div class="alert {% if 'berhasil' in message.lower() %}alert-success{% else %}alert-danger{% endif %} p-2 text-center" style="font-size: 0.9rem;">
                {{ message }}
            </div>
            {% endif %}

            <form action="/register" method="POST">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" placeholder="nama@domain.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Password" required minlength="6" required>
                </div>
                <button type="submit" class="btn btn-pet w-100 py-2 fw-bold">Daftar Akun</button>
            </form>

            <div class="text-center mt-4">
                <p class="small">Sudah punya akun? <a href="/login" class="text-orange fw-bold text-decoration-none">Masuk di sini</a></p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
