<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pet Butler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .btn-pet { background-color: #ff914d; color: white; border-radius: 10px; }
        .btn-pet:hover { background-color: #e6732f; color: white; }
        .card-auth { border-radius: 15px; border: none; }
        .text-orange { color: #ff914d; }
    </style>
</head>
<body>

<div class="container vh-100 d-flex align-items-center justify-content-center">
    <div class="card card-auth shadow-lg" style="width: 100%; max-width: 400px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <h2 class="fw-bold text-orange">🐾 Pet Butler</h2>
                <p class="text-muted">Silakan login ke akun Anda</p>
            </div>

            {% if message %}
            <div class="alert alert-danger p-2 text-center" style="font-size: 0.9rem;">
                {{ message }}
            </div>
            {% endif %}

            <form action="/login" method="POST">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" placeholder="nama@email.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="******" required>
                </div>
                <button type="submit" class="btn btn-pet w-100 py-2 fw-bold">Login</button>
            </form>

            <div class="text-center mt-4">
                <p class="small">Belum punya akun? <a href="/register" class="text-orange fw-bold text-decoration-none">Daftar Sekarang</a></p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
